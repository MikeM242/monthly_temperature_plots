      padding: 15px;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fcfcfc;
    }
    /* Controls weather chart dimensions safely */
    .weather-chart {
      max-width: 100%;
      height: auto;
      display: block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);

  <div id="content">
    <p>Please select a month to load its data.</p>
  </div>

  <script>
    function loadPage() {
      const selector = document.getElementById('monthSelector');
      const file = selector.value;
      const contentDiv = document.getElementById('content');

      if (!file) {
        contentDiv.innerHTML = "<p>Please select a month to load its data.</p>";
        return;
      }

      // Replaced the network fetch with a native image tag implementation
      contentDiv.innerHTML = `<img src="${file}" class="weather-chart" alt="Weather Chart for ${selector.options[selector.selectedIndex].text}" />`;
    }
  </script>
